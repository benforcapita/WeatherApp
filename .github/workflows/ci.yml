name: Weather quality
on:
  push:
    branches: ['product/**']
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NODE_OPTIONS: --max-old-space-size=1536
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:demo
      - name: Verify installed official Chrome
        run: /usr/bin/google-chrome --version
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weather-verification
          path: |
            test-results/
            dist-demo/
          retention-days: 7
